<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="hierarchy.pageTitle">Waza Stammbaum – Kendō Lookup</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/waza.css">
</head>
<body class="layout-single-col" data-page="waza">

<nav id="site-nav"></nav>

<div class="container">
  <header>
    <h1>Kendō Waza (剣道技) – <span data-i18n="hierarchy.titleSuffix">Stammbaum</span></h1>
    <p data-i18n="hierarchy.subtitle">Hierarchische vertikale Gliederung der Techniken in Shikake-Waza (Initiative) und Ōji-Waza (Reaktion) mit Kanji und Details.</p>
  </header>

  <div class="toolbar">
    <div class="nav-pills" id="nav-pills"></div>

    <div class="layout-controls">
      <span data-i18n="hierarchy.toolbar.viewLabel">Ansicht:</span>
      <button type="button" class="layout-btn active" id="btnSingleCol" data-i18n="hierarchy.toolbar.singleCol">☰ Vertikal (1-spaltig)</button>
      <button type="button" class="layout-btn" id="btnTwoCol" data-i18n="hierarchy.toolbar.twoCol">☷ Geteilt (2-spaltig)</button>
    </div>

    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="wazaSearch" data-i18n-placeholder="hierarchy.toolbar.searchPlaceholder" data-i18n-aria="hierarchy.toolbar.searchAria" placeholder="Waza suchen... (z. B. Men, Kote, Harai, Nuki, すり上げ)" aria-label="Waza durchsuchen">
    </div>
  </div>

  <div class="tree-wrapper">
    <div class="tree-root-container">
      <div class="node-root">
        Kendō Waza
        <span class="jp">剣道技 • <span data-i18n="hierarchy.rootSubtitle">Gesamtheit aller Techniken</span></span>
      </div>
      <div class="root-stem-line"></div>
    </div>

    <div class="branches-container" id="branches-container"></div>
    <p class="empty-state" id="empty-search-state" data-i18n="hierarchy.units.emptySearch">Keine passenden Waza gefunden.</p>
  </div>
</div>

<footer id="site-footer"></footer>

<script src="js/layout.js"></script>
<script src="js/i18n.js"></script>
<script src="js/waza.js"></script>
</body>
</html>
